name = "gs"
main = "worker.js"
compatibility_date = "2026-02-04"
keep_vars = true

# KV 绑定：部署后在 Cloudflare Dashboard → Worker → Settings → Bindings 中
# 添加 KV Namespace，变量名设为 GLADOS_KV
# 如果用 wrangler CLI 部署，取消下面注释并填入你自己账号的 KV ID：
# kv_namespaces = [
#   { binding = "GLADOS_KV", id = "你的KV命名空间ID" }
# ]

[triggers]
# UTC 1:30（北京时间 9:30）
crons = ["30 1 * * *"]
